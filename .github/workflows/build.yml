
name: Build GlobalEQ APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android packages
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "build-tools;37.0.0"

      - name: Build APK
        run: |
          chmod +x build_app.sh
          bash build_app.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlobalEQ-APK
          path: build/GlobalEQ.apk
          if-no-files-found: error
          retention-days: 7
