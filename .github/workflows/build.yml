
name: Build Global EQ APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Locate Android SDK tools
        shell: bash
        run: |
          SDK="$ANDROID_HOME"

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "SDKMANAGER=$SDK/cmdline-tools/latest/bin/sdkmanager" >> "$GITHUB_ENV"
          elif [ -x "$SDK/cmdline-tools/16.0/bin/sdkmanager" ]; then
            echo "SDKMANAGER=$SDK/cmdline-tools/16.0/bin/sdkmanager" >> "$GITHUB_ENV"
          else
            echo "ERROR: sdkmanager not found"
            find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Prepare Linux build script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("build_app.sh")
          if not p.exists():
              raise SystemExit("ERROR: build_app.sh not found in repository root")

          s = p.read_text()

          replacements = {
              'SDK="$LOCALAPPDATA/Android/Sdk"':
                  'SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"',
              'JDK=/c/users/xios/apps/jdk-21.0.12.1+1/bin':
                  'JDK="${JAVA_HOME}/bin"',
              'aapt2.exe': 'aapt2',
              'zipalign.exe': 'zipalign',
              'd8.bat': 'd8',
              'd8.exe': 'd8',
              'java.exe': 'java',
              'jar.exe': 'jar',
              'apksigner.bat': 'apksigner',
              'apksigner.exe': 'apksigner',
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          p.write_text(s)
          PY

          chmod +x build_app.sh

          echo "=== Build script after patch ==="
          cat build_app.sh

      - name: Build APK
        shell: bash
        run: |
          bash build_app.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlobalEQ-APK
          path: build/GlobalEQ.apk
          if-no-files-found: error
