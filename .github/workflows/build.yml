
name: Build Global EQ APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install required SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          sdkmanager --list_installed

      - name: Make build script Linux-compatible
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("build_app.sh")
          if not p.exists():
              raise SystemExit("ERROR: build_app.sh not found in repository root")

          s = p.read_text()

          replacements = {
              'SDK="$LOCALAPPDATA/Android/Sdk"':
                  'SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"',
              'JDK=/c/users/xios/apps/jdk-21.0.12.1+1/bin':
                  'JDK="${JAVA_HOME}/bin"',
              'aapt2.exe': 'aapt2',
              'java.exe': 'java',
              'jar.exe': 'jar',
              'apksigner.bat': 'apksigner',
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          p.write_text(s)
          PY
          chmod +x build_app.sh

      - name: Build APK
        shell: bash
        run: |
          bash build_app.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlobalEQ-APK
          path: build/GlobalEQ.apk
          if-no-files-found: error
