
name: Build Global EQ APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "build-tools;37.0.0"

      - name: Make build script Linux-compatible
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build_app.sh")
          s = p.read_text()
          s = s.replace('SDK="$LOCALAPPDATA/Android/Sdk"',
                        'SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"')
          s = s.replace('JDK=/c/users/xios/apps/jdk-21.0.12.1+1/bin',
                        'JDK="${JAVA_HOME}/bin"')
          s = s.replace('aapt2.exe', 'aapt2')
          s = s.replace('java.exe', 'java')
          s = s.replace('jar.exe', 'jar')
          s = s.replace('apksigner.bat', 'apksigner')
          p.write_text(s)
          PY
          chmod +x build_app.sh

      - name: Build APK
        run: bash build_app.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlobalEQ-APK
          path: build/GlobalEQ.apk
          if-no-files-found: error
