
name: Build Global EQ APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/21.0.*/x64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Locate Android SDK tools
        shell: bash
        run: |
          SDK="${ANDROID_HOME}"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/34.0.0" >> "$GITHUB_PATH"

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "SDKMANAGER=$SDK/cmdline-tools/latest/bin/sdkmanager" >> "$GITHUB_ENV"
          elif [ -x "$SDK/cmdline-tools/16.0/bin/sdkmanager" ]; then
            echo "SDKMANAGER=$SDK/cmdline-tools/16.0/bin/sdkmanager" >> "$GITHUB_ENV"
          else
            echo "ERROR: sdkmanager not found in Android SDK"
            find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses </dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Prepare build script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("build_app.sh")
          if not p.exists():
              raise SystemExit("ERROR: build_app.sh not found")

          s = p.read_text()
          s = s.replace('SDK="$LOCALAPPDATA/Android/Sdk"',
                        'SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"')
          s = s.replace('JDK=/c/users/xios/apps/jdk-21.0.12.1+1/bin',
                        'JDK="${JAVA_HOME}/bin"')
          s = s.replace('aapt2.exe', 'aapt2')
          s = s.replace('java.exe', 'java')
          s = s.replace('jar.exe', 'jar')
          s = s.replace('apksigner.bat', 'apksigner')
          p.write_text(s)
          PY
          chmod +x build_app.sh

      - name: Build APK
        shell: bash
        run: bash build_app.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlobalEQ-APK
          path: build/GlobalEQ.apk
          if-no-files-found: error
